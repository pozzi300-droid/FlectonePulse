name: Build Patch

on:
  push:
    branches:
      - patch/**

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Paper JAR
        run: |
          chmod +x ./gradlew
          ./gradlew :minecraft:paper:buildFinalJar --no-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlectonePulse-patched
          path: minecraft/paper/build/libs/*.jar
          if-no-files-found: error
